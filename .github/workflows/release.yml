name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version from plugins/codex-autoresearch/package.json, for example 1.1.12'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version from plugins/codex-autoresearch/package.json, for example 1.1.12'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Enforce third-party action pinning
        run: node .github/scripts/check-workflow-policy.mjs

  test:
    needs: workflow-policy
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-autoresearch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: plugins/codex-autoresearch/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run full check gate
        run: npm run check

      - name: Run CLI smoke test
        run: node scripts/autoresearch.mjs --help

      - name: Run finalizer launcher smoke test
        run: node scripts/finalize-autoresearch.mjs --help

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: plugins/codex-autoresearch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Refuse non-main release
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the release workflow from main, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: plugins/codex-autoresearch/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must look like 1.2.3, got $INPUT_VERSION."
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          lock_version="$(node -p "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8')).version")"
          lock_root_version="$(node -p "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8')).packages[''].version")"
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json', 'utf8')).version")"
          if [ "$version" != "$package_version" ] || [ "$version" != "$lock_version" ] || [ "$version" != "$lock_root_version" ] || [ "$version" != "$manifest_version" ]; then
            echo "::error::Input version $version does not match package.json $package_version, package-lock.json $lock_version, package-lock root $lock_root_version, and plugin.json $manifest_version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Do not push release tags manually."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

      - name: Create package artifact
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${{ steps.version.outputs.version }}.tgz"
          npm pack
          test -f "$tarball"
          sha256sum "$tarball" > "$tarball.sha256"
          sha256sum -c "$tarball.sha256"

      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: plugins/codex-autoresearch/codex-autoresearch-${{ steps.version.outputs.version }}.tgz

      - name: Smoke release package
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${{ steps.version.outputs.version }}.tgz"
          test -f "$tarball"
          test -f "$tarball.sha256"
          node scripts/check.mjs --phase release-package-smoke --tarball "$tarball" --checksum "$tarball.sha256"

      - name: Create GitHub release with tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${VERSION}.tgz"
          checksum="$tarball.sha256"
          gh release create "$TAG" "$tarball#$tarball" "$checksum#$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Smoke release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${VERSION}.tgz"
          checksum="$tarball.sha256"
          node scripts/check.mjs --phase release-provenance-smoke \
            --tarball "$tarball" \
            --checksum "$checksum" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target-commit "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
