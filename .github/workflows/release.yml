name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version from plugins/codex-autoresearch/package.json, for example 1.1.12'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version from plugins/codex-autoresearch/package.json, for example 1.1.12'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Enforce action pinning
        run: node .github/scripts/check-workflow-policy.mjs

  test:
    needs: workflow-policy
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 45 }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-autoresearch
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: plugins/codex-autoresearch/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run full check gate
        run: npm run check

      - name: Run required Chrome dashboard smoke
        if: runner.os == 'Linux'
        env:
          CODEX_AUTORESEARCH_BROWSER: /usr/bin/google-chrome
        run: npm run test:dashboard:browser

      - name: Install cross-browser dashboard engines
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser dashboard gate
        if: runner.os == 'Linux'
        run: npm run test:dashboard:cross-browser

      - name: Upload cross-browser dashboard evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-cross-browser-release-${{ github.run_attempt }}
          path: plugins/codex-autoresearch/tmp/dashboard-cross-browser/
          if-no-files-found: warn
          retention-days: 14

      - name: Run CLI smoke test
        run: node scripts/autoresearch.mjs --help

      - name: Run finalizer launcher smoke test
        run: node scripts/finalize-autoresearch.mjs --help

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: plugins/codex-autoresearch
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Refuse non-main release
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the release workflow from main, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: plugins/codex-autoresearch/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if ! node -e "const semver=require('semver'); if (!semver.valid(process.argv[1])) process.exit(1);" "$version"; then
            echo "::error::Release version is not valid SemVer: $INPUT_VERSION."
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          lock_version="$(node -p "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8')).version")"
          lock_root_version="$(node -p "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8')).packages[''].version")"
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json', 'utf8')).version")"
          if [ "$version" != "$package_version" ] || [ "$version" != "$lock_version" ] || [ "$version" != "$lock_root_version" ] || [ "$version" != "$manifest_version" ]; then
            echo "::error::Input version $version does not match package.json $package_version, package-lock.json $lock_version, package-lock root $lock_root_version, and plugin.json $manifest_version."
            exit 1
          fi
          latest_version="$(git tag --list 'v*' | node -e "const semver=require('semver'); let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const versions=input.split(/\\s+/).map(value => value.replace(/^v/, '')).filter(semver.valid); process.stdout.write(versions.sort(semver.rcompare)[0] || ''); });")"
          if [ -n "$latest_version" ] && ! node -e "const semver=require('semver'); if (!semver.gt(process.argv[1], process.argv[2])) process.exit(1);" "$version" "$latest_version"; then
            echo "::error::Release version $version must be greater than the latest existing version $latest_version."
            exit 1
          fi
          prerelease="$(node -e "const semver=require('semver'); process.stdout.write(semver.prerelease(process.argv[1]) ? 'true' : 'false');" "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Refuse existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Do not push release tags manually."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

      - name: Create package artifact
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${{ steps.version.outputs.version }}.tgz"
          npm pack
          test -f "$tarball"
          sha256sum "$tarball" > "$tarball.sha256"
          sha256sum -c "$tarball.sha256"

      - name: Attest package provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: plugins/codex-autoresearch/codex-autoresearch-${{ steps.version.outputs.version }}.tgz

      - name: Smoke release package
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${{ steps.version.outputs.version }}.tgz"
          test -f "$tarball"
          test -f "$tarball.sha256"
          node scripts/check.mjs --phase release-package-smoke --tarball "$tarball" --checksum "$tarball.sha256"

      - name: Create GitHub release with tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${VERSION}.tgz"
          checksum="$tarball.sha256"
          release_flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "$tarball#$tarball" "$checksum#$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${release_flags[@]}"

      - name: Smoke release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tarball="codex-autoresearch-${VERSION}.tgz"
          checksum="$tarball.sha256"
          node scripts/check.mjs --phase release-provenance-smoke \
            --tarball "$tarball" \
            --checksum "$checksum" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target-commit "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
